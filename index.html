<html lang="pt-BR">
<head>

<title>Controle de campo</title>
<meta charset="utf-8">
<style>
:root{
  --azul:#1b365d; --azul2:#27497a; --teal:#0e7c86; --teal-c:#e3f2f3; --verde:#2e7d4f; --verde-c:#e5f3ea;
  --ambar:#a8650a; --ambar-c:#fdf1dc; --verm:#b42318; --verm-c:#fdebe9; --azul-c:#e8eef7;
  --cinza:#5b6472; --cinza-c:#f1f3f6; --borda:#e1e5eb; --fundo:#f6f7f9; --txt:#1d2430;
  --r:10px; --sombra:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--fundo);color:var(--txt);font:14px/1.45 Calibri,"Segoe UI",system-ui,-apple-system,Arial,sans-serif}
a{color:var(--teal)}
button{font:inherit;cursor:pointer}
.topo{background:var(--azul);color:#fff;padding:0 24px;display:flex;align-items:center;gap:20px;height:58px;position:sticky;top:0;z-index:20}
.marca{font-weight:700;letter-spacing:.2px;white-space:nowrap}
.marca small{display:block;font-weight:400;opacity:.75;font-size:12px;margin-top:-2px}
.nav{display:flex;gap:4px;flex:1;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{background:transparent;border:0;color:#cfd9e8;padding:8px 12px;border-radius:8px;white-space:nowrap;font-size:14px}
.nav button:hover{background:rgba(255,255,255,.08);color:#fff}
.nav button.ativo{background:rgba(255,255,255,.14);color:#fff;font-weight:600}
.nav .pill{background:#f5b041;color:#1b365d;border-radius:20px;padding:0 7px;font-size:11px;font-weight:700;margin-left:6px}
.usuario{font-size:12px;text-align:right;opacity:.85;white-space:nowrap}
.usuario button{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:6px;padding:3px 8px;margin-left:6px;font-size:12px}
main{max-width:1320px;margin:0 auto;padding:22px 24px 60px}
h1{font-size:20px;margin:0 0 4px;color:var(--azul)}
.sub{color:var(--cinza);margin:0 0 18px;font-size:13px}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin-bottom:16px}
.card{background:#fff;border:1px solid var(--borda);border-radius:var(--r);box-shadow:var(--sombra)}
.kpi{padding:14px 16px}
.kpi .rot{font-size:12px;color:var(--cinza);text-transform:uppercase;letter-spacing:.4px}
.kpi .val{font-size:26px;font-weight:700;color:var(--azul);margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .val small{font-size:14px;color:var(--cinza);font-weight:400}
.kpi .det{font-size:12px;color:var(--cinza);margin-top:2px}
.barra{height:8px;background:var(--cinza-c);border-radius:6px;overflow:hidden;display:flex;margin-top:8px}
.barra i{display:block;height:100%}
.barra .ap{background:var(--verde)} .barra .pe{background:#e3a63a}
.bloco{padding:16px 18px;margin-bottom:16px}
.bloco h2{font-size:15px;margin:0 0 12px;color:var(--azul);display:flex;align-items:center;gap:10px}
.bloco h2 .dir{margin-left:auto;font-weight:400;font-size:12px;color:var(--cinza)}
.duas{grid-template-columns:1.4fr 1fr}
@media(max-width:980px){.duas{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:600;color:var(--cinza);font-size:12px;padding:8px 10px;border-bottom:1px solid var(--borda);white-space:nowrap;background:#fafbfc}
td{padding:8px 10px;border-bottom:1px solid #eef1f4;vertical-align:middle}
tr:hover td{background:#fafcff}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.tab-wrap{overflow:auto;border-radius:var(--r)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap}
.b-abordar{background:var(--teal-c);color:var(--teal)} .b-agendada{background:var(--azul-c);color:var(--azul2)}
.b-validacao{background:var(--ambar-c);color:var(--ambar)} .b-ok{background:var(--verde-c);color:var(--verde)}
.b-cota{background:var(--cinza-c);color:var(--cinza)} .b-limite{background:#e9ebef;color:#424b59}
.b-recusa{background:var(--verm-c);color:var(--verm)} .b-anulada{background:#fff;color:var(--verm);border:1px solid #f1b8b2}
.b-alerta{background:var(--verm-c);color:var(--verm);font-weight:500} .b-info{background:var(--azul-c);color:var(--azul2);font-weight:500}
.filtros{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
input[type=search],input[type=text],select,textarea{font:inherit;border:1px solid #cfd6df;border-radius:8px;padding:7px 10px;background:#fff;color:var(--txt)}
input[type=search]{min-width:240px;flex:1;max-width:360px}
textarea{width:100%;min-height:70px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{border:1px solid var(--borda);background:#fff;border-radius:20px;padding:4px 10px;font-size:12px;color:var(--cinza)}
.chip b{color:var(--txt);margin-left:4px}
.chip.ativo{border-color:var(--teal);background:var(--teal-c);color:var(--teal)}
.btn{border:1px solid #cfd6df;background:#fff;border-radius:8px;padding:6px 12px;font-size:13px;color:var(--txt);display:inline-flex;align-items:center;gap:6px;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:#9fb0c4;background:#fafbfc}
.btn-p{background:var(--teal);border-color:var(--teal);color:#fff}.btn-p:hover{background:#0b6970;border-color:#0b6970}
.btn-ok{background:var(--verde);border-color:var(--verde);color:#fff}.btn-ok:hover{background:#256641}
.btn-x{color:var(--verm);border-color:#efc2bd}.btn-x:hover{background:var(--verm-c)}
.btn-s{padding:4px 9px;font-size:12px}
.acoes{display:flex;gap:6px;justify-content:flex-end}
.muted{color:var(--cinza)} .peq{font-size:12px}
.vazio{padding:36px;text-align:center;color:var(--cinza)}
.avisos li{margin-bottom:6px} .avisos{padding-left:18px;margin:0}
.seg{display:inline-flex;border:1px solid #cfd6df;border-radius:8px;overflow:hidden}
.seg button{border:0;background:#fff;padding:6px 12px;font-size:13px;border-right:1px solid #e3e7ec;color:var(--cinza)}
.seg button:last-child{border-right:0}.seg button.ativo{background:var(--azul);color:#fff}
.ent{padding:14px 16px;margin-bottom:10px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start}
.ent .l1{font-size:12px;color:var(--cinza)} .ent .l2{font-size:15px;font-weight:600;margin:2px 0 6px}
.ent .tags{display:flex;flex-wrap:wrap;gap:6px}
.pres td{text-align:center;padding:6px} .pres th{text-align:center}
.pres td:first-child,.pres th:first-child{text-align:left}
.cel{width:38px;height:32px;border-radius:7px;border:1px dashed #cdd5df;background:#fff;color:transparent;font-weight:700}
.cel.on{background:var(--verde);border:1px solid var(--verde);color:#fff}
.cel.warn{border:1.5px solid #e38b2c;background:var(--ambar-c)}
.cel small{display:block;font-size:10px;color:var(--cinza)}
.ativ{font-size:10px;color:var(--cinza);display:block;margin-top:2px;min-height:12px}
.lista-ap{display:grid;gap:10px}
.cp{padding:14px 16px;display:flex;gap:12px;align-items:center}
.cp .gab{min-width:76px;text-align:center;background:var(--azul-c);color:var(--azul);border-radius:8px;padding:8px 6px;font-weight:700;line-height:1.1}
.cp .gab small{display:block;font-weight:400;font-size:11px;color:var(--cinza);margin-top:2px}
.cp .info{flex:1;min-width:0}.cp .nome{font-weight:600;font-size:15px}
.cp .acoes{flex-direction:column;align-items:stretch}
@media(max-width:640px){
  .topo{padding:8px 12px 0;gap:6px 10px;height:auto;flex-wrap:wrap}.marca small,#quem,#atual{display:none}
  .usuario{margin-left:auto}.nav{order:3;flex-basis:100%;padding-bottom:6px}
  .carregando{top:0}
  .filtros>*{flex:1 1 100%}.filtros .seg{display:flex}.filtros .seg button{flex:1}
  .saud{gap:10px}.saud .ola{flex-basis:100%}.mini{flex:1}
  main{padding:14px 12px 60px} input[type=search]{min-width:0;width:100%;max-width:none}
  .cp{flex-wrap:wrap}.cp .acoes{flex-direction:row;width:100%}.cp .acoes .btn{flex:1;justify-content:center}
}
.modal{position:fixed;inset:0;background:rgba(16,24,40,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.aberto{display:flex}
.modal .box{background:#fff;border-radius:12px;max-width:480px;width:100%;padding:20px;box-shadow:0 20px 40px rgba(0,0,0,.2)}
.modal h3{margin:0 0 4px;color:var(--azul);font-size:17px}
.modal label{display:block;font-size:12px;color:var(--cinza);margin:12px 0 4px;font-weight:600}
.modal select,.modal input{width:100%}
.modal .rod{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1d2430;color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}.toast.erro{background:var(--verm)}
.carregando{position:fixed;top:58px;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,var(--teal),transparent);background-size:50% 100%;animation:car 1s linear infinite;display:none;z-index:30}
.carregando.on{display:block}
@keyframes car{from{background-position:-50% 0}to{background-position:150% 0}}
.legenda{display:flex;gap:14px;font-size:12px;color:var(--cinza);margin-top:8px;flex-wrap:wrap}
.legenda i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.saud{padding:16px 18px;margin-bottom:14px;display:flex;gap:18px;flex-wrap:wrap;align-items:center}
.saud .ola{flex:1;min-width:200px}.saud .ola b{font-size:17px;color:var(--azul)}
.mini{text-align:center;min-width:86px}.mini .v{font-size:20px;font-weight:700;color:var(--azul)}.mini .r{font-size:11px;color:var(--cinza);text-transform:uppercase}
.tot td{font-weight:700;background:#fafbfc}

/* v02 */
.b-nv{background:#eceff3;color:#424b59;border:1px dashed #9aa5b4}
.btn-g{font-size:17px;padding:14px 28px;border-radius:10px;font-weight:600}
.foto{width:64px;height:80px;border-radius:8px;object-fit:cover;background:var(--cinza-c);flex:none}
.cp.fim{opacity:.6}

/* v08: uso em celular */
.bnav{display:none}
.offline{display:none;background:var(--ambar-c);color:var(--ambar);text-align:center;font-size:13px;padding:7px 12px;position:sticky;top:58px;z-index:19}
.offline.on{display:block}
.aviso-cache{background:var(--azul-c);color:var(--azul2);border-radius:8px;padding:8px 12px;font-size:13px;margin-bottom:12px}
.menu-mais{display:grid;gap:6px;margin-top:12px}
.menu-mais button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--borda);background:#fff;border-radius:10px;padding:13px 14px;font-size:15px;color:var(--txt)}
.menu-mais button svg{width:22px;height:22px;fill:var(--teal);flex:none}
.menu-mais button .pill{margin-left:auto;background:#e3a63a;color:#fff;border-radius:10px;font-size:11px;padding:1px 7px;font-weight:700}
.menu-mais button.sair{color:var(--verm)} .menu-mais button.sair svg{fill:var(--verm)}
.dias-pres{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0 10px}
.dias-pres::-webkit-scrollbar{display:none}
.dias-pres button{flex:none;border:1px solid var(--borda);background:#fff;border-radius:10px;padding:8px 12px;text-align:center;min-width:64px;color:var(--txt)}
.dias-pres button small{display:block;font-size:11px;color:var(--cinza)}
.dias-pres button.ativo{background:var(--azul);border-color:var(--azul);color:#fff}.dias-pres button.ativo small{color:#cfd9e8}
.pres-lista .item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid #eef1f4}
.pres-lista .item:last-child{border-bottom:0}
.pres-lista .item .nm{flex:1;min-width:0}.pres-lista .item .nm b{display:block;font-size:15px}
.chave{position:relative;width:56px;height:32px;border-radius:20px;border:0;background:#d5dbe3;flex:none;transition:background .15s}
.chave::after{content:'';position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s}
.chave.on{background:var(--verde)}.chave.on::after{left:27px}
.instalar-card{display:flex;gap:12px;align-items:center}
.instalar-card .txt{flex:1}
@media(max-width:760px){
  html,body{font-size:15px}
  .topo{height:auto;min-height:52px;padding:8px 14px;padding-top:calc(8px + env(safe-area-inset-top));flex-wrap:nowrap;gap:10px}
  .topo .nav{display:none}
  .marca{font-size:16px}.marca small,#quem,#atual{display:none}
  .usuario{margin-left:auto}.usuario button{padding:8px 14px;font-size:14px;border-radius:8px}
  .carregando{top:0}
  .offline{top:52px}
  main{padding:14px 12px calc(86px + env(safe-area-inset-bottom))}
  h1{font-size:19px}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:1px solid var(--borda);padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -2px 12px rgba(16,24,40,.07)}
  .bnav button{flex:1;border:0;background:none;padding:7px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--cinza);position:relative;min-height:58px;-webkit-tap-highlight-color:transparent}
  .bnav button svg{width:24px;height:24px;fill:currentColor}
  .bnav button.ativo{color:var(--teal);font-weight:700}
  .bnav button.ativo::before{content:'';position:absolute;top:0;left:25%;right:25%;height:3px;border-radius:0 0 3px 3px;background:var(--teal)}
  .bnav .pill{position:absolute;top:3px;left:50%;margin-left:4px;background:#e3a63a;color:#fff;border-radius:10px;font-size:10px;padding:0 5px;font-weight:700;line-height:16px}
  input[type=search],input[type=text],select,textarea{font-size:16px;padding:10px 12px}
  .btn{padding:10px 14px;font-size:14px;min-height:44px;justify-content:center}
  .btn-s{padding:8px 12px;font-size:13px;min-height:40px}
  .btn-g{width:100%;padding:16px 20px}
  .filtros>*{flex:1 1 100%;min-width:0;max-width:100%}
  .filtros select{width:100%}
  .filtros:has(> input[type=search]:only-child){position:sticky;top:var(--topo-h,52px);z-index:15;background:var(--fundo);padding:8px 0;margin:-8px 0 8px}
  .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -12px 12px;padding:0 12px}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;padding:8px 13px;font-size:13px}
  .kpis{grid-template-columns:1fr 1fr;gap:10px}
  .kpi{padding:12px}.kpi .val{font-size:22px}.kpi .rot{font-size:11px}
  .grid.duas{grid-template-columns:1fr !important}
  .bloco{padding:14px}
  .bloco h2{flex-wrap:wrap;gap:4px 10px}.bloco h2 .dir{margin-left:0;flex-basis:100%}
  .tab-wrap{overflow:visible}
  table.rt,table.rt tbody,table.rt tr,table.rt td{display:block;width:100%}
  table.rt thead{display:none}
  table.rt tr{background:#fff;border-bottom:1px solid var(--borda);padding:10px 12px}
  table.rt tr:last-child{border-bottom:0}
  table.rt td{border:0;padding:4px 0;display:block;text-align:right;min-height:26px;overflow:hidden}
  table.rt td::before{content:attr(data-l);float:left;color:var(--cinza);font-size:12px;text-align:left;max-width:48%;margin-right:12px;line-height:20px}
  table.rt td:first-child{font-size:15px;text-align:left;display:block;padding-bottom:4px}
  table.rt td:first-child::before,table.rt td[data-l=""]::before{display:none}
  table.rt td:empty{display:none}
  table.rt td .acoes{display:inline-flex;justify-content:flex-end;flex-wrap:wrap}
  table.rt td .barra{display:inline-flex;width:55%;vertical-align:middle;margin:0 !important}
  table.rt tr:hover td{background:none}
  table.rt tr.tot{background:#fafbfc}
  table.rt td.vazio{display:block;text-align:center}
  .ent{grid-template-columns:1fr;padding:14px}
  .ent .acoes{justify-content:stretch}.ent .acoes .btn{flex:1}
  .cp{align-items:flex-start}
  .modal{align-items:flex-end;padding:0}
  .modal .box{max-width:none;border-radius:16px 16px 0 0;max-height:90vh;overflow:auto;padding:18px 16px calc(16px + env(safe-area-inset-bottom));animation:sobe .18s ease-out}
  .modal .rod{position:sticky;bottom:calc(-16px - env(safe-area-inset-bottom));background:#fff;padding:10px 0 4px;margin-bottom:0}
  .modal .rod .btn{flex:1}
  .toast{bottom:calc(78px + env(safe-area-inset-bottom))}
  .saud{padding:14px}
}
@keyframes sobe{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
</style>
</head>
<body>
<header class="topo">
  <div class="marca">Controle de campo<small id="pesq"></small></div>
  <nav class="nav" id="nav"></nav>
  <div class="usuario"><span id="quem"></span><button onclick="carregar()" title="Atualizar">Atualizar</button><div class="peq" id="atual"></div></div>
</header>
<div class="carregando" id="car"></div>
<div class="offline" id="offline">Sem conexão com a internet. Os dados na tela podem estar desatualizados.</div>
<main id="main"><div class="vazio">Carregando dados do campo...<br><span class="peq">Na primeira abertura pode levar até 20 segundos.</span></div></main>
<nav class="bnav" id="bnav"></nav>
<div class="modal" id="modal"><div class="box" id="mbox"></div></div>
<div class="toast" id="toast"></div>

<script>window.API_URL = 'https://script.google.com/macros/s/AKfycbyOad2ydFl9xA1v1Bm9da1Rl75StdLGNrHtm5Vkj-wI-c7La6zqf1xofxGUNGUCzRKO/exec';</script>
<script>
// API_URL é definida só na página hospedada fora do Google; no Apps Script fica vazia e as chamadas usam google.script.run.
const API_URL = window.API_URL || '';
const TOKEN = API_URL ? lerToken() : '';
// v08: o código de acesso fica salvo no aparelho, para abrir pelo ícone da tela inicial sem o link.
function lerToken() {
  const h = (location.hash.match(/t=([0-9a-f]+)/i) || [])[1] || '';
  try { if (h) { localStorage.setItem('cc_t', h); return h; } return localStorage.getItem('cc_t') || ''; } catch (e) { return h; }
}
function guardar(k, v) { try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { } }
function ler(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
let PAPEL = API_URL ? '' : '';
let NOME = API_URL ? '' : '';
let D = null;
let VIEW = '';

const F = { busca: '', estrato: '', orient: '', predio: '', sit: 'Pendente', atrib: '' };

// ---------- utilidades
const $ = s => document.querySelector(s);
const esc = s => String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const brl = v => 'R$ ' + Number(v || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const pct = (v, d = 1) => v === null || v === undefined ? '–' : (v * 100).toLocaleString('pt-BR', { minimumFractionDigits: d, maximumFractionDigits: d }) + '%';

}
function carregando(on) { $('#car').className = 'carregando' + (on ? ' on' : ''); }

function chamar(fn, args, ok) {
  carregando(true);
  const fim = r => { carregando(false); ok && ok(r); };
  const erro = e => {
    carregando(false);
    const msg = (e && e.message) || String(e);
    if (/não autorizado|revogado/i.test(msg)) { guardar('cc_t', null); guardar('cc_d', null); }
    if (!D) $('#main').innerHTML = '<div class="vazio"><p>' + esc(msg) + '</p><p><button class="btn btn-p" onclick="$(\'#main\').innerHTML=\'<div class=vazio>Carregando dados do campo...</div>\';carregar(true)">Tentar de novo</button></p></div>';
    else toast(msg, true);
  };
  if (API_URL) {
    fetch(API_URL, {
      method: 'POST', credentials: 'omit', redirect: 'follow', cache: 'no-store',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ fn: fn, t: TOKEN, args: args || [] })
    })
      .then(r => { if (!r.ok) throw new Error('Servidor indisponível (' + r.status + '). Toque em Atualizar.'); return r.json(); })
      .then(j => { if (!j || !j.ok) throw new Error((j && j.erro) || 'Erro no servidor.'); fim(j.r); })
      .catch(e => erro(/fetch|network|load failed/i.test((e && e.message) || '') ? new Error('Sem conexão com o servidor. Verifique a internet e toque em Atualizar.') : e));
    return;
  }
  if (window.google && google.script && google.script.run) {
    google.script.run.withSuccessHandler(fim).withFailureHandler(erro)[fn].apply(null, [TOKEN].concat(args || []));
  } else if (window.MOCK) {
    try { fim(window.MOCK(fn, args)); } catch (e) { erro(e); }
  }
}

// ---------- parlamentares (coordenação)
VIEWS.parlamentares = () => {
  const ests = [...new Set(D.parlamentares.map(p => p.estrato))].sort();
  const preds = [...new Set(D.parlamentares.map(p => p.predio))].sort();
  return '<h1>Parlamentares</h1><p class="sub">Situação de cada deputado, atualizada a cada questionário recebido. Vínculo entre deputado e entrevista: visível somente para a coordenação.</p>' +
    '<div class="filtros"><input type="search" placeholder="Buscar nome, gabinete, partido ou UF" value="' + esc(F.busca) + '" oninput="setF(\'busca\',this.value)">' +
    '<select onchange="setF(\'estrato\',this.value)"><option value="">Todos os estratos</option>' + ests.map(e => '<option' + (F.estrato === e ? ' selected' : '') + '>' + esc(e) + '</option>').join('') + '</select>' +
    '<select onchange="setF(\'predio\',this.value)"><option value="">Todos os prédios</option>' + preds.map(e => '<option' + (F.predio === e ? ' selected' : '') + '>' + esc(e) + '</option>').join('') + '</select></div>' +
    '<div class="chips" id="chips"></div><div class="card tab-wrap" id="lista"></div>';
};

function filtrarParl(base) {
  const b = F.busca.trim().toLowerCase();
  return base.filter(p => (!F.estrato || p.estrato === F.estrato) && (!F.predio || p.predio === F.predio) &&
    (!b || (p.nome + ' ' + p.chave + ' ' + p.partido + ' ' + p.uf).toLowerCase().indexOf(b) >= 0));
}
LISTAS.parlamentares = () => {
  const base = filtrarParl(D.parlamentares);
  $('#chips').innerHTML = chipsOrient(base);
  const lista = base.filter(p => !F.orient || p.orient === F.orient);
  $('#lista').innerHTML = lista.length ? '<table><thead><tr><th>Gabinete</th><th>Parlamentar</th><th>Estrato</th><th>Eleição 2026</th><th>Situação</th><th>Entrevista</th></tr></thead><tbody>' +
    lista.map(p => '<tr><td><b>' + esc(p.gab) + '</b> <span class="muted peq">' + esc(p.predio) + (p.andar ? ', ' + esc(p.andar) + 'º' : '') + '</span></td><td>' + parl(p) + '</td><td class="peq">' + esc(p.estrato) + '</td><td class="peq">' + (p.eleicao === 'Não preenchido' ? '<span class="muted">–</span>' : esc(p.eleicao)) + '</td><td>' + badge(p.orient) + '</td><td class="peq">' +
      (p.entrevistaId ? esc(p.entrevistaId) : '<span class="muted">–</span>') + (p.naLista ? ' <span class="badge b-info">lista residual' + (p.atribCod ? ' · ' + esc(p.atribCod) : '') + '</span>' : '') + '</td></tr>').join('') +
    '</tbody></table>' : '<div class="vazio">Nenhum parlamentar com esses filtros.</div>';
};

// ---------- validação
VIEWS.validacao = () => {
  const cont = s => D.entrevistas.filter(x => s === '' || (s === 'NV' ? x.nv : x.sit === s)).length;
  return '<h1>Validação de questionários</h1><p class="sub">Somente questionários aprovados entram na amostra e no pagamento. Entrevistas de estrato fechado e duplicadas chegam como não validadas, com o motivo, e permanecem na base.</p>' +
    '<div class="filtros"><div class="seg">' + [['Pendente', 'Pendentes'], ['Aprovada', 'Aprovadas'], ['NV', 'Não validadas'], ['Anulada', 'Anuladas'], ['', 'Todas']].map(s =>
      '<button class="' + (F.sit === s[0] ? 'ativo' : '') + '" onclick="F.sit=\'' + s[0] + '\';render()">' + s[1] + ' (' + cont(s[0]) + ')</button>').join('') + '</div>' +
    '<input type="search" placeholder="Buscar ID, parlamentar, aplicador" value="' + esc(F.busca) + '" oninput="setF(\'busca\',this.value)"></div><div id="lista"></div>';
};

LISTAS.validacao = () => {
  const b = F.busca.trim().toLowerCase();
  const l = D.entrevistas.filter(x => (F.sit === '' || (F.sit === 'NV' ? x.nv : x.sit === F.sit)) && (!b || (x.id + ' ' + x.nome + ' ' + x.aplic + ' ' + x.chave).toLowerCase().indexOf(b) >= 0));
  $('#lista').innerHTML = l.length ? l.map(x => '<div class="card ent"><div><div class="l1">' + esc(x.id) + ' · enviado em ' + esc(x.enviado) + ' · início ' + esc(x.inicio || '–') + ' · ' + esc(x.aplic) + '</div>' +
    '<div class="l2">' + parl(x) + ' <span class="muted peq">' + esc(x.chave) + '</span></div><div class="tags">' + badge(x.sit) +
    '<span class="badge b-cota">' + esc(x.estrato) + '</span>' + (x.fase === 'Dirigida' ? '<span class="badge b-info">Fase dirigida</span>' : '') + '<span class="badge b-cota">Duração: ' + (x.dur === null ? '–' : x.dur + ' min') + '</span>' +
    '<span class="badge ' + (x.quem === 'Assessor' ? 'b-alerta' : 'b-cota') + '">Respondeu: ' + esc(x.quem) + '</span>' +
    (x.verificar ? '<span class="badge ' + (x.verifRes ? (x.verifRes === 'Confirmada' ? 'b-ok' : 'b-alerta') : 'b-info') + '">Verificação: ' + esc(x.verifRes || 'sorteada, pendente') + '</span>' : '') +
    x.alertas.map(a => '<span class="badge b-alerta">' + esc(a) + '</span>').join('') + '</div>' +
    (x.sit !== 'Pendente' ? '<div class="peq muted" style="margin-top:6px">' + esc(x.sit) + ' por ' + esc(x.validPor) + ' em ' + esc(x.validEm) + (x.motivo ? ' · Motivo: ' + esc(x.motivo) : '') + '</div>' : '') +
    '</div><div class="acoes">' + (x.sit === 'Pendente'
      ? '<button class="btn btn-ok btn-s" onclick="aprovar(\'' + esc(x.id) + '\')">Aprovar</button><button class="btn btn-x btn-s" onclick="modalAnular(\'' + esc(x.id) + '\')">Anular</button>'
      : '<button class="btn btn-s" onclick="reabrir(\'' + esc(x.id) + '\')">' + (x.nv ? 'Rever' : 'Reabrir') + '</button>') + '</div></div>').join('')
    : '<div class="card vazio">Nenhum questionário nesta situação.</div>';
};

function aprovar(id) {
  const x = D.entrevistas.find(e => e.id === id);
  if (x.verificar && !x.verifRes) return modalVerificacao(id);
  if (x.alertas.length && !confirm('Esta entrevista tem alerta(s):\n- ' + x.alertas.join('\n- ') + '\n\nAprovar mesmo assim?')) return;
  chamar('apiValidar', [id, 'Aprovada', '', ''], s => { D = JSON.parse(s); render(); toast(id + ' aprovada'); });
}
function reabrir(id) {
  const x = D.entrevistas.find(e => e.id === id);
  const msg = x.nv
    ? id + ' está como "' + x.sit + '".\n' + (x.motivo || '') + '\n\nEnviar para a fila de validação mesmo assim? A decisão fica registrada no LOG.'
    : 'Voltar ' + id + ' para pendente de validação?';
  if (!confirm(msg)) return;
  chamar('apiValidar', [id, 'Pendente', '', ''], s => { D = JSON.parse(s); render(); toast(id + ' enviada para validação'); });
}

const MOTIVOS = ['Duplicidade de gabinete', 'Respondida por pessoa não prevista no desenho', 'Não confirmada na verificação com o gabinete', 'Duração incompatível com o questionário', 'Inconsistência entre respostas', 'Outro'];
function modalAnular(id) {
  abrirModal('<h3>Anular ' + esc(id) + '</h3><p class="peq muted">A anulação fica registrada no LOG e o questionário sai da base válida e do pagamento.</p>' +
    '<label>Motivo</label><select id="m_mot">' + MOTIVOS.map(m => '<option>' + m + '</option>').join('') + '</select>' +
    '<label>Detalhamento</label><textarea id="m_det" placeholder="Descreva o que foi constatado"></textarea>' +
    '<div class="rod"><button class="btn" onclick="fecharModal()">Cancelar</button><button class="btn btn-x" onclick="confAnular(\'' + esc(id) + '\')">Anular questionário</button></div>');
}
function confAnular(id) {
  const m = $('#m_mot').value, d = $('#m_det').value.trim();
  if (m === 'Outro' && !d) return toast('Descreva o motivo.', true);
  fecharModal();
  chamar('apiValidar', [id, 'Anulada', m + (d ? ': ' + d : ''), ''], s => { D = JSON.parse(s); render(); toast(id + ' anulada'); });
}
function modalVerificacao(id) {
  abrirModal('<h3>Verificação de ' + esc(id) + '</h3><p class="peq muted">Esta entrevista foi sorteada para verificação. Registre o contato com o gabinete: confirmação da realização, duração aproximada e quem respondeu.</p>' +
    '<label>Resultado</label><select id="m_ver"><option>Confirmada</option><option>Não confirmada</option></select>' +
    '<label>Observação (obrigatória se não confirmada)</label><textarea id="m_obs"></textarea>' +
    '<div class="rod"><button class="btn" onclick="fecharModal()">Cancelar</button><button class="btn btn-p" onclick="confVerif(\'' + esc(id) + '\')">Registrar e decidir</button></div>');
}
function confVerif(id) {
  const v = $('#m_ver').value, o = $('#m_obs').value.trim();
  if (v === 'Não confirmada' && !o) return toast('Descreva o resultado do contato.', true);
  fecharModal();
  const dec = v === 'Confirmada' ? 'Aprovada' : 'Anulada';
  chamar('apiValidar', [id, dec, v === 'Confirmada' ? '' : 'Não confirmada na verificação com o gabinete: ' + o, v], s => { D = JSON.parse(s); render(); toast(id + (dec === 'Aprovada' ? ' verificada e aprovada' : ' anulada após verificação')); });
}

// ---------- presença
VIEWS.presenca = () => MOVEL.matches ? presencaDia() : presencaTabela();
function diasPresenca() {
  return [...new Set((D.cfg.DIAS || []).concat(Object.keys(D.presenca)).concat(Object.keys(D.atividade)))].filter(Boolean)
    .sort((a, b) => a.split('/').reverse().join('').localeCompare(b.split('/').reverse().join('')));
}
function presencaDia() {
  const dias = diasPresenca(), hoje = String(D.atualizado || '').slice(0, 10);
  if (!F.diaPres || dias.indexOf(F.diaPres) < 0) F.diaPres = dias.indexOf(hoje) >= 0 ? hoje : (dias.filter(d => d.split('/').reverse().join('') <= hoje.split('/').reverse().join('')).pop() || dias[0] || hoje);
  const d = F.diaPres, ap = D.aplicadores.filter(a => a.ativo), pres = D.presenca[d] || {};
  const n = ap.filter(a => pres[a.cod]).length;
  return '<h1>Presença</h1><p class="sub">Escolha o dia e toque na chave para marcar ou desmarcar. Cada dia marcado vale ' + brl(D.cfg.VALOR_DIA) + '.</p>' +
    '<div class="dias-pres">' + dias.map(x => '<button class="' + (x === d ? 'ativo' : '') + '" onclick="F.diaPres=\'' + x + '\';render()">' + x.slice(0, 5) + '<small>' + diaSem(x) + (x === hoje ? ' · hoje' : '') + '</small></button>').join('') + '</div>' +
    '<div class="card"><div class="pres-lista">' + ap.map(a => {
      const on = !!pres[a.cod], at = D.atividade[d] && D.atividade[d][a.cod], tot = at ? at.env + at.tent : 0;
      return '<div class="item"><div class="nm"><b>' + esc(a.nome) + '</b><span class="peq muted">' + esc(a.cod) + (tot ? ' · ' + (at.env ? at.env + ' quest.' : '') + (at.env && at.tent ? ' · ' : '') + (at.tent ? at.tent + ' tent.' : '') : '') + '</span>' +
        (!on && tot ? ' ' + badge('atividade sem presença', 'b-alerta') : '') + '</div>' +
        '<button class="chave' + (on ? ' on' : '') + '" aria-label="Presença de ' + esc(a.nome) + '" onclick="presenca(\'' + d + '\',\'' + a.cod + '\',' + !on + ')"></button></div>';
    }).join('') + '</div></div>' +
    '<p class="peq muted" style="margin-top:10px">' + n + ' de ' + ap.length + ' presentes em ' + d + ' · ' + brl(n * D.cfg.VALOR_DIA) + ' no dia.</p>';
}
function presencaTabela() {
  const dias = [...new Set((D.cfg.DIAS || []).concat(Object.keys(D.presenca)).concat(Object.keys(D.atividade)))].filter(Boolean)
    .sort((a, b) => a.split('/').reverse().join('').localeCompare(b.split('/').reverse().join('')));
  const ap = D.aplicadores.filter(a => a.ativo);
  return '<h1>Controle de presença</h1><p class="sub">Clique na célula para marcar ou desmarcar a presença. Cada dia marcado vale ' + brl(D.cfg.VALOR_DIA) + '. O número abaixo indica tentativas e questionários registrados pelo aplicador no dia; borda laranja indica atividade sem presença lançada.</p>' +
    '<div class="card tab-wrap"><table class="pres"><thead><tr><th>Aplicador</th>' + dias.map(d => '<th>' + d.slice(0, 5) + '<br><span class="muted peq">' + diaSem(d) + '</span></th>').join('') + '<th class="n">Dias</th><th class="n">Valor</th></tr></thead><tbody>' +
    ap.map(a => {
      let n = 0;
      const cels = dias.map(d => {
        const on = !!(D.presenca[d] && D.presenca[d][a.cod]); if (on) n++;
        const at = D.atividade[d] && D.atividade[d][a.cod];
        const tot = at ? at.env + at.tent : 0;
        return '<td><button class="cel' + (on ? ' on' : '') + (!on && tot ? ' warn' : '') + '" title="' + esc(a.nome) + ' em ' + d + '" onclick="presenca(\'' + d + '\',\'' + a.cod + '\',' + !on + ')">✓</button><span class="ativ">' + (tot ? (at.env ? at.env + ' quest.' : '') + (at.env && at.tent ? ' · ' : '') + (at.tent ? at.tent + ' tent.' : '') : '') + '</span></td>';
      }).join('');
      return '<tr><td><b>' + esc(a.cod) + '</b> ' + esc(a.nome) + '</td>' + cels + '<td class="n">' + n + '</td><td class="n">' + brl(n * D.cfg.VALOR_DIA) + '</td></tr>';
    }).join('') +
    '<tr class="tot"><td>Presentes</td>' + dias.map(d => '<td>' + Object.keys(D.presenca[d] || {}).length + '</td>').join('') + '<td></td><td></td></tr></tbody></table></div>';
};
function presenca(d, cod, on) {
  D.presenca[d] = D.presenca[d] || {}; if (on) D.presenca[d][cod] = true; else delete D.presenca[d][cod];
  render();
  chamar('apiPresenca', [d, cod, on], s => { D = JSON.parse(s); render(); });
}

// ---------- pagamentos
VIEWS.pagamentos = () => {
  const p = D.pagamentos, t = k => p.reduce((s, x) => s + x[k], 0);
  const vqd = D.cfg.VALOR_QUESTIONARIO_DIRIGIDA;
  return '<h1>Pagamentos</h1><p class="sub">Regra: ' + brl(D.cfg.VALOR_DIA) + ' por dia com presença lançada pela coordenação + ' + brl(D.cfg.VALOR_QUESTIONARIO) + ' por questionário aprovado' +
    (vqd === null ? '' : ' (' + brl(vqd) + ' na fase dirigida, para deputado da lista do próprio aplicador)') + '. Questionários em validação aparecem como potencial. Não validados (estrato fechado ou duplicidade) e anulados não são pagos.</p>' +
    '<div class="filtros"><button class="btn btn-p" onclick="fechar()">Registrar fechamento na planilha</button><span class="peq muted">Cria uma aba PAGTO_data com os valores deste momento.</span></div>' +
    '<div class="card tab-wrap"><table><thead><tr><th>Aplicador</th><th class="n">Dias</th><th class="n">Valor dias</th><th class="n">Aprovados</th><th class="n">Na fase dirigida</th><th class="n">Valor questionários</th><th class="n">Total apurado</th><th class="n">Em validação</th><th class="n">Potencial</th><th class="n">Não validados</th><th class="n">Anulados</th></tr></thead><tbody>' +
    p.map(x => '<tr><td><b>' + esc(x.cod) + '</b> ' + esc(x.nome) + '</td><td class="n">' + x.dias + '</td><td class="n">' + brl(x.vDias) + '</td><td class="n">' + x.aprov + '</td><td class="n">' + x.aprovDir + '</td><td class="n">' + brl(x.vQuest) + '</td><td class="n"><b>' + brl(x.total) + '</b></td><td class="n">' + x.pend + '</td><td class="n muted">' + brl(x.potencial) + '</td><td class="n">' + x.naoValid + '</td><td class="n">' + x.anul + '</td></tr>').join('') +
    '<tr class="tot"><td>Total</td><td class="n">' + t('dias') + '</td><td class="n">' + brl(t('vDias')) + '</td><td class="n">' + t('aprov') + '</td><td class="n">' + t('aprovDir') + '</td><td class="n">' + brl(t('vQuest')) + '</td><td class="n">' + brl(t('total')) + '</td><td class="n">' + t('pend') + '</td><td class="n">' + brl(t('potencial')) + '</td><td class="n">' + t('naoValid') + '</td><td class="n">' + t('anul') + '</td></tr></tbody></table></div>';
};

function fechar() {
  if (!confirm('Registrar o fechamento com os valores atuais?')) return;
  chamar('apiFecharPagamento', [], url => { abrirModal('<h3>Fechamento registrado</h3><p>A aba foi criada na planilha de controle.</p><div class="rod"><button class="btn" onclick="fecharModal()">Fechar</button><a class="btn btn-p" target="_blank" href="' + esc(url) + '" onclick="fecharModal()">Abrir planilha</a></div>'); });
}

  D.aplicadores.map(a => {

      '<td><div class="acoes">' + (D.links && D.links[a.cod] ? '<button class="btn btn-s" onclick="verLink(\'' + a.cod + '\')">Link de acesso</button>' : '<span class="peq muted">gerar links em Manutenção</span>') + '</div></td></tr>';

    const st = SDEP[p.s] || SDEP.D, url = p.s === 'D' ? linkForm(p.g, D.cod) : '';
    const foto = /^\d+$/.test(p.f || '') ? 'https://www.camara.leg.br/internet/deputado/bandep/' + p.f + '.jpg' : p.f;
    return '<div class="card cp' + (p.s === 'D' ? '' : ' fim') + '">' + (foto ? '<img class="foto" src="' + esc(foto) + '" alt="" loading="lazy" onerror="this.style.visibility=\'hidden\'">' : '<div class="foto"></div>') +
      '<div class="info"><div class="nome">' + esc(p.n) + ' <span class="muted">(' + esc(p.p) + '/' + esc(p.u) + ')</span></div>' +
      '<div class="peq" style="margin-top:2px">Gabinete <b>' + esc(p.g) + '</b>' + (p.pr ? ' · ' + esc(p.pr) : '') + (p.a ? ' · ' + esc(p.a) + 'º andar' : '') + '</div>' +
      '<div style="margin-top:6px">' + badge(st[0], st[1]) + (p.s === 'F' ? ' <span class="peq muted">' + esc(p.e) + '</span>' : '') + '</div>' +
      (url ? '<div style="margin-top:8px"><a class="btn btn-s" target="_blank" href="' + esc(url) + '">Questionário com este gabinete</a></div>' : '') +
      '</div></div>';
  }).join('') + (l.length > mostra.length ? '<p style="text-align:center"><button class="btn" onclick="F.maisDep=1;LISTAS.deputados()">Mostrar todos (' + l.length + ')</button></p>' : '')
    : '<div class="vazio">Nenhum deputado encontrado.</div>';
};

VIEWS.minhalista = () => {
  const l = D.dirigida.minha.slice().sort((a, b) => {
    const pa = a.orient === 'Agendada' ? 0 : a.orient === 'Não entrevistado' ? 1 : 2, pb = b.orient === 'Agendada' ? 0 : b.orient === 'Não entrevistado' ? 1 : 2;
    return pa - pb || String(a.predio).localeCompare(String(b.predio)) || (+a.gab || 0) - (+b.gab || 0);
  });
  return '<h1>Minha lista</h1><p class="sub">Deputados atribuídos a você na fase dirigida. Máximo de ' + D.cfg.MAX_TENTATIVAS + ' tentativas por deputado. Registre cada visita sem entrevista.</p><div class="lista-ap">' +
    l.map(p => {
      const pode = p.orient === 'Não entrevistado' || p.orient === 'Agendada', k = encodeURIComponent(p.chave);
      return '<div class="card cp' + (pode ? '' : ' fim') + '">' + (p.foto ? '<img class="foto" src="' + esc(p.foto) + '" alt="" loading="lazy" onerror="this.style.visibility=\'hidden\'">' : '<div class="foto"></div>') +
        '<div class="info"><div class="nome">' + parl(p) + '</div><div class="peq" style="margin-top:2px">Gabinete ' + esc(p.gab) + ' · ' + esc(p.predio) + (p.andar ? ' · ' + esc(p.andar) + 'º andar' : '') + (p.sala && p.sala !== p.gab ? ' · sala ' + esc(p.sala) : '') + '</div>' +
        '<div style="margin-top:6px">' + badge(p.orient) + ' <span class="peq muted">' + p.tentDir + ' de ' + D.cfg.MAX_TENTATIVAS + ' tentativa(s)' + (p.ultimaData ? ' · última: ' + esc(p.ultimaDesc) + ' ' + esc(p.ultimaData) : '') + '</span></div>' +
        (p.ultimaObs && p.orient === 'Agendada' ? '<div class="peq" style="margin-top:4px">Agendamento: ' + esc(p.ultimaObs) + '</div>' : '') + '</div>' +
        (pode ? '<div class="acoes"><a class="btn btn-p" target="_blank" href="' + esc(linkForm(p.gab, D.cod)) + '">Aplicar questionário</a><button class="btn" onclick="modalTentativa(\'' + k + '\')">Registrar tentativa</button></div>' : '') + '</div>';
    }).join('') + '</div>';
};

function abrirModal(html) { $('#mbox').innerHTML = html; $('#modal').classList.add('aberto'); }
function fecharModal() { $('#modal').classList.remove('aberto'); }
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') fecharModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') fecharModal(); });

if (API_URL && !TOKEN) {
  $('#main').innerHTML = '<div class="vazio"><h2>Link incompleto</h2><p>Abra o link completo enviado pela coordenação.</p></div>';
} else {
  medirTopo(); conexao();
  const c = API_URL ? ler('cc_d') : null;
  if (c) { try { const o = JSON.parse(c); if (o.t === TOKEN) { D = JSON.parse(o.s); PAPEL = D.papel; NOME = D.nome; DOCACHE = true; render(); } } catch (e) { } }
  carregar(true);
}
</script>
</body>
